[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dink-proxy"
version = "0.1.0"
description = "DinkProxy - webhook interception & dynamic routing proxy"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.13",
    "requests>=2.31",
    "werkzeug>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dinkproxy*"]

[project.optional-dependencies]
prod = ["gunicorn>=26"]
